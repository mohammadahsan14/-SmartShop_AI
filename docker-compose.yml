services:

  db:
    image: pgvector/pgvector:pg16
    container_name: smartshop-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - smartshop_db_data:/var/lib/postgresql/data


  api:
    build: .
    container_name: smartshop-api

    command: >
      python -m uvicorn
      src.api.api:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      - db


  ui:
    build: .
    container_name: smartshop-ui

    command: >
      python -m streamlit run
      app/app.py
      --server.address 0.0.0.0
      --server.port 8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_URL: http://api:8000/chat

    depends_on:
      - api


volumes:
  smartshop_db_data: