## Deploy SmartShop to EC2 using GitHub Actions + AWS OIDC + Systems Manager.
## No SSH key is required.

name: Deploy SmartShop to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          export ID_TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          python - <<'PY'
          import os, json, base64

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "sub",
              "aud",
              "repository",
              "repository_owner",
              "ref"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::803714739045:role/SmartShop-GitHub-Actions-Role
          aws-region: us-east-1

      - name: Deploy through AWS Systems Manager
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu bash -lc 'cd /home/ubuntu/-SmartShop_AI && git pull origin main'",
              "cd /home/ubuntu/-SmartShop_AI && docker compose up -d --build"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0638f0e35651cec27" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0638f0e35651cec27"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0638f0e35651cec27"